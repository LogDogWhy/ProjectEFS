- type: entity
  abstract: true
  parent: BaseObjective
  id: BaseTarkovObjective
  components:
  - type: Objective
    issuer: objective-issuer-syndicate

- type: entity
  abstract: true
  parent: [BaseTarkovObjective, BaseStealObjective]
  id: BaseTarkovFindObjective
  components:
  - type: StealCondition
    verifyMapExistence: false
  - type: Objective
    difficulty: 1


- type: entity
  parent: BaseTarkovFindObjective
  id: TarkovFindObjective
  components:
  - type: StealCondition
    stealGroup: RandomTask

