- type: entity
  parent: ClothingMilitaryBackpack
  id: Fiiled_EFSClothingMilitaryBackpack
  noSpawn: true
  components:
  - type: StorageFill
    contents:
      - id: Salewa
        amount: 1
      - id: Esmarh
        amount: 1
      - id: DrinkWaterBottleFull
        amount: 1
      - id: FoodSnackNutribrick
        amount: 1

- type: job
  id: Passenger
  name: job-name-passenger
  description: job-description-passenger
  playTimeTracker: JobPassenger
  icon: "BearFaction"
  startingGear: BearGear

- type: startingGear
  id: BearGear
  name: Набор Bear
  inList: false
  equipment:
    shoes: ClothingShoesColorBlack
    id: BadgeBEAR
    # back: ClothingMilitaryBackpack

# - type: playTimeTracker
