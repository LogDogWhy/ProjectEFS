- type: entity
  id: SpawnPointBEAR
  parent: SpawnPointJobBase
  name: Spawn Point BEAR
  components:
  - type: SpawnPoint
    job_id: Passenger
  - type: Sprite
    layers:
      - state: green
      - state: hop

- type: entity
  id: SpawnPointBEARLateJoin
  suffix: LateJoin
  parent: SpawnPointJobBase
  name: Spawn Point BEAR
  components:
  - type: SpawnPoint
    job_id: Passenger
    spawn_type: LateJoin
  - type: Sprite
    layers:
      - state: green
      - state: hop



