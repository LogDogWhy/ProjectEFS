- type: entity
  parent: Clothing
  id: BaseBadge
  name: identification card
  description: A card necessary to access various areas aboard the station.
  noSpawn: true
  components:
  - type: Sprite
    sprite: GG/Clothing/Badges/badges.rsi
  - type: Clothing
    slots:
    - idcard
    sprite: GG/Clothing/Badges/badges.rsi
  - type: Item
    heldPrefix: default
    size: Tiny
  - type: Access
  - type: IdCard
  - type: StationRecordKeyStorage
  - type: ESWeight
    self: 0.1

