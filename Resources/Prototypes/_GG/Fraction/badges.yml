    - state: bear
  - type: PresetIdCard
    job: Passenger

- type: entity
  parent: BaseBadge
  id: BadgeUSEC
  name: Жетон "USEC"
  components:
  - type: Sprite
    layers:
    - state: usec
  - type: PresetIdCard
    job: Passenger
