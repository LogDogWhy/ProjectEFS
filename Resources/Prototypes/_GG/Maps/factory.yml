- type: gameMap
  id: REZERV
  mapName: REZERV
  mapPath: /Maps/Tarkov/Rezerv/rezerv.yml
  minPlayers: 0
  stations:
    REZERV:
      stationProto: StandardStationArena
      components:
        - type: StationNameSetup
          mapNameTemplate: "REZERV"
        - type: StationJobs
          overflowJobs:
            - Passenger
            - USEC
          availableJobs:
            Passenger: [ -1, -1 ]
            USEC: [ -1, -1 ]

