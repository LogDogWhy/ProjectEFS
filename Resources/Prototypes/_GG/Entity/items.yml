  id: Xeno
  name: Монтажная пена Xenomorph
  description: Xenomorph - монтажная пена с превосходной структурой ячеек и высокой механической прочностью. Проста в употреблении, наносится тонкой трубкой-аппликатором. Пена является саморасширяющимся материалом, при твердении увеличивается в объеме примерно в два раза. Обладает превосходной адгезией к большинству таких строительных материалов, как дерево, бетон, камень, металл, и т.д. Изделие не содержит хлор-фтор-углеродных пропеллентов. Является надежным и экономичным решением для герметизации и заполнения пустот.
