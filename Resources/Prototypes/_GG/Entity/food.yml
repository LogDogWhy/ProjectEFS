- type: entity
  parent: FoodTinBase
  id: EFSFoodBeens
  name: Банка бобов
  description: Банка полезных тушеных бобов с длительным сроком хранения. Закрытая банка может храниться от двух до пяти лет в зависимости от условий хранения.
  components:
  - type: Sprite
    sprite: GG/Objects/Food/beens.rsi
  - type: Food
    trash: EFSFoodBeensTrash

- type: entity
  parent: FoodTinBaseTrash
  id: EFSFoodBeensTrash
  name: Пустая банка бобов
  description: Банка полезных тушеных бобов с длительным сроком хранения. Закрытая банка может храниться от двух до пяти лет в зависимости от условий хранения. Похоже ею уже кто-то полакомился...
  components:
  - type: Sprite
    sprite: GG/Objects/Food/beens.rsi

- type: entity
  parent: FoodTinBase
