- type: entity
  parent: FoodTinBase
  id: EFSFoodCannedMilk
  name: Сгущенное молоко
  description: Сгущённое молоко с сахаром, в гражданскую войну входившее в сухпаёк североамериканской армии, достигло несравнимой популярности в странах постсоветского пространства, став одним из основных продуктов. Законсервированное в жестяных банках, оно может храниться десятилетиями, оставаясь вкусным и питательным
  components:
  - type: Sprite
    sprite: GG/Objects/Food/cannedmilk.rsi
  - type: Food
    trash: EFSFoodCannedMilkTrash

- type: entity
  parent: FoodTinBaseTrash
  id: EFSFoodCannedMilkTrash
  description: Похоже им уже кто-то полакомился...
  name: Пустое сгущенное молоко
  components:
  - type: Sprite
    sprite: GG/Objects/Food/cannedmilk.rsi
