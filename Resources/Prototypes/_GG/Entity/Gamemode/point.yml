- type: entity
  name: Флаг A
  id: EFSCapturePointA
  parent: BaseStructure
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: GG/Effects/zone.rsi
    state: pointa
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 1.5
        hard: false
        layer:
          - LowImpassable
  - type: WarpPoint
    follow: false
    location: Точка А
  - type: GGCapturePoint
    pointName: A


