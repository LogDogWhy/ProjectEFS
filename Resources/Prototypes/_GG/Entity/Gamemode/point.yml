- type: entity
  id: CapturePoint
  parent: BaseGameRule
  components:
  - type: CapturePointGameRule
  - type: KillCalloutRule
  - type: RespawnDeadRule
  - type: RespawnTracker
    respawnDelay: 5
    deleteBody: true

- type: gamePreset
  id: CapturePointMode
  alias:
  - capturepoint
  name: Capture Point
  showInVote: true #4boring4vote
  description: Захватите точку
  rules:
  - CapturePoint
