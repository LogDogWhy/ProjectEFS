  description: Главное не зацепиться
  components:
  - type: Sprite
    state: wire
    snapCardinals: false
  - type: Rotatable
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepBarbWire
      params:
        volume: 8
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        layer:
          - SlipLayer
        mask:
          - ItemMask
        density: 1000
        hard: false
  - type: StepTrigger
    requiredTriggeredSpeed: 0
    # intersectRatio: 0.1
  - type: TileEntityEffect
    effects:
    - !type:ModifyBleedAmount
      amount: 2.5
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.35
    sprintSpeedModifier: 0.35

