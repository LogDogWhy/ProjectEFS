- type: entity
  parent: ClothingBeltStorageBase
  id: ClothingBeltRPSholder
  name: TV-109 + TV-106 (РПС)
  description: Тяжелая подвесная система TV-109 предназначены для крепления на пояс TV-106, или аналогичный, с целью разгрузить часть веса на плечи. Плечи усилены пенкой и имеют стропы MOLLE, для перевода пояса в комплекте с этой системой в полноценную РПС.
  components:
  - type: Sprite
    sprite: GG/Clothing/Belt/rpsholder.rsi
  - type: Clothing
    sprite: GG/Clothing/Belt/rpsholder.rsi
  - type: Item
    size: Normal
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,3,1
    whitelist:
      components:
        - BallisticAmmoProvider
        - CartridgeAmmo
        - RangedMagazine
        - Ammo
        - Flash
        - GrenadeBase
        - Injector
        - Pill
        - ExplodeOnTrigger
  - type: ESWeight
    self: 1

