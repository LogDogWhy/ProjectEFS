- type: entity
  name: Картотека
  parent: [ BaseStructureDynamic, BaseBagOpenClose ]
  id: filingCardCab
  suffix: Empty
  description: A cabinet for all your filing needs.
  components:
  - type: Storage
    storageOpenSound:
      path: /Audio/GG/Objects/Files/open.ogg
    storageCloseSound:
      path: /Audio/GG/Objects/Files/close.ogg
    grid:
    - 0,0,1,1
    maxItemSize: Normal
  - type: Sprite
    sprite: GG/Objects/Storage/cardboard.rsi
    state: box
    noRot: true
    layers:
    - state: box
    - state: box-open
      map: ["openLayer"]
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Transform
    noRot: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.18,-0.48,0.18,0.48"
        density: 200
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: ContainerContainer
    containers:
      storagebase: !type:Container

- type: entity
  parent: [filingCardCab, BaseTarkovmedStorageFill]
  id: filingCardCabRandom
  suffix: Random

