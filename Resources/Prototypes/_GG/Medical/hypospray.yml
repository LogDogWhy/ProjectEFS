- type: entity
  name: Стимулятор "Тримадол"
  parent: ChemicalMedipen
  id: EFSTrimadolPen
  description: Опиоидный синтетический анальгетик, разработанный для бойцов спецподразделений. Обладает центральным действием и действием на спинной мозг (способствует открытию К+ и Са2+ каналов, вызывает гиперполяризацию мембран и тормозит проведение болевых импульсов). Повышает боевые характеристики. Передозировка приводит к истощению организма после окончания действия.
  components:
  - type: Sprite
    sprite: GG/Medical/Injectors/stimulator.rsi
    scale: 0.5, 0.5
    layers:
    - state: trimadol
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: trimadol_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 15
  - type: SolutionContainerManager
