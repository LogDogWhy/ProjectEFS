- type: entity
  name: Гемостатическое средство "Загустин"
  parent: ChemicalMedipen
  id: ZagustinPen
  description: Военный препарат. Ингибирует активаторы профибринолизина и тормозит его превращение в фибринолизин. Временно останавливает кровотечение и повышает устойчивость к новым. Имеет побочные эффекты. Приводит к сильной дегидратации.
  components:
  - type: Sprite
    sprite: GG/Medical/Injectors/stimulator.rsi
    scale: 0.5, 0.5
    layers:
    - state: zagustin
      map: [ "enum.SolutionContainerLayers.Fill" ]
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: zagustin_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 15
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
          - ReagentId: Zagustin
            Quantity: 15
  - type: Tag
    tags: []

