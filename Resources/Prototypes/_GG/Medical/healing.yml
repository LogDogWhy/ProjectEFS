- type: entity
  name: Мазь
  parent: BaseItem
  id: EFSBaseMaz
  abstract: true
  components:
  - type: Sprite
    sprite: GG/Medical/Medicine/medical.rsi
    scale: 0.5, 0.5
  - type: Icon
    sprite: GG/Medical/Medicine/medical.rsi
  - type: Item
    size: Tiny
    heldPrefix: 0
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 3
  - type: Injector
    toggleState: Inject
    injectOnly: true
    minTransferAmount: 1
    maxTransferAmount: 1
    transferAmount: 1
  - type: Appearance
  - type: Tag
    tags:
    - Syringe

- type: entity
  parent: EFSBaseMaz
  id: Vazelin
  name: Вазелиновая мазь
  description: Вазелин - универсальная мазь, применяемая везде, где требуются водоизоляционные или смазочные свойства, например, санобработка небольших царапин и ожогов, нанесение защитного покрытия на склонные к коррозии предметы или смазка механизмов, требующих не содержащих кислоты смазок.
  components:
  - type: Sprite
    state: vaz
  - type: Icon
    state: vaz
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 3
        reagents:
        - ReagentId: Morphine
          Quantity: 3

- type: entity
  parent: EFSBaseMaz
  id: GoldStar
  name: Мазь "Золотая Звезда"
  description: Мазь «Золотая Звезда», или, в народе, просто "звёздочка", изготавливается в братском Вьетнаме из целого коктейля жгучих эфирных масел - камфоры, ментола, мяты, эвкалипта и др. - замешанных в вазелин. Нанесённая в правильные места, спасает от головной боли, простуды и насморка, и укусов насекомых. Только для наружного применения!
  components:
  - type: Sprite
    state: star
  - type: Icon
    state: star
  - type: SolutionContainerManager
    solutions:
      injector:
        maxVol: 3
        reagents:
        - ReagentId: Morphine
          Quantity: 3
