- type: entity
  name: Glock-18
  parent: BaseWeaponPistol
  id: EFSWeaponPistolGlock
  description: Glock 18 — австрийский пистолет, разработанный фирмой Glock для нужд австрийской армии. Благодаря своим боевым качествам и надёжности получил широкое распространение в качестве полицейского, спортивного, а так же гражданского оружия самообороны.
  components:
  - type: Sprite
    sprite: GG/Weapons/glock.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundLoudGunshot:
      path: /Audio/GG/Weapons/Glock/shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: EFSMagazinePistolGlock
        insertSound: /Audio/GG/Weapons/Glock/in.ogg
        ejectSound: /Audio/GG/Weapons/Glock/out.ogg
        priority: 2
        whitelist:
          tags:
            - EFSMagazinePistolGlock
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ESWeight
    self: 1.5

