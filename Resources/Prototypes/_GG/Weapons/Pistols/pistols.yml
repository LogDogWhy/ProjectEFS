- type: entity
  name: Colt 1911A1
  parent: BaseWeaponPistol
  id: EFSWeaponPistolColt
  description: "Широко известный, как просто 'Кольт', M1911 является одним из самых известных пистолетов в мире. M1911A1 это дальнейшее развитие пистолета M1911. После Первой Мировой войны 1911 претерпел множество эргономических изменений, среди которых: укороченный спусковой крючок, улучшенные механические прицельные приспособления а также обновленный автоматический предохранитель."
  components:
  - type: Sprite
    sprite: GG/Weapons/colt.rsi
  - type: Gun
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundLoudGunshot:
      path: /Audio/GG/Weapons/Colt/shot.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: EFSMagazinePistolColt
        insertSound: /Audio/GG/Weapons/Colt/in.ogg
        ejectSound: /Audio/GG/Weapons/Colt/out.ogg
        priority: 2
        whitelist:
          tags:
            - EFSMagazinePistolColt
      gun_chamber:
        name: Chamber
        startingItem: Cartridge.45
        priority: 1
        whitelist:
          tags:
            - Cartridge.45
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: ESWeight
    self: 1.5

