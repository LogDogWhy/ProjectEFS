- type: entity
  name: SKS
  parent: BaseWeaponSniper
  id: EFSWeaponRifleSKS
  description: Советский самозарядный карабин конструкции Сергея Симонова под патрон 7.62x39, за рубежом также известен как СКС-45. Невероятно популярное в странах СНГ и на западе оружие, до сих пор состоящее на вооружении в отдельных странах в виде различных клонов и модификаций. Конкретно этот образец производства Тульского Оружейного Завода со складов длительного хранения, не успевший пройти процедуру приведения к 'стандартам гражданского рынка'.
  components:
  - type: Sprite
    sprite: GG/Weapons/sks.rsi
    layers:
      - state: base
        scale: 0.75, 0.75
        map: ["enum.GunVisualLayers.Base"]
      - sprite: GG/Weapons/Mods/barrels.rsi
        map: ["enum.GunVisualLayers.Suppressor"]
        scale: 0.8, 0.8
        offset: 0.75, 0.025
        visible: false
  - type: Item
    size: SniperRifles
  - type: Gun
    minAngle: 1
    maxAngle: 18
    angleIncrease: 3
    angleDecay: 90
    fireRate: 5
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundLoudGunshot:
      path: /Audio/GG/Weapons/SKS/shot.ogg
    soundSilGunshot:
      path: /Audio/GG/Weapons/SKS/sil.ogg
    soundGunshot:
      path: /Audio/GG/Weapons/SKS/shot.ogg
  - type: BallisticAmmoProvider
    autoCycle: true
    cycleable: true
    capacity: 10
    proto: Cartridge7.62x39
    whitelist:
      tags:
      - Cartridge7.62x39
  - type: ContainerContainer
    containers:
      gun_suppressor: !type:ContainerSlot
      ballistic-ammo: !type:Container
        ents: []
  - type: Appearance
  - type: ItemSlots
    slots:
      gun_suppressor:
        priority: 0
        whitelist:
          tags:
            - EFSAkmBarrel
  - type: SuppressorVisuals
    suppressorState: suppressor
  - type: Suppressor
