- type: entity
  id: BaseMagazinePistolMP5
  name: "Магазин MP5 9x19"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
      - EFSMagazineTarkov
      - EFSMagazinePistol9x19MP5
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge9x19
    capacity: 30
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: GG/Weapons/AmmoRebuild/MagazineMP59x19/30.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
