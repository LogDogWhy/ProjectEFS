- type: entity
  name: АК-74
  parent: EFSBaseRifleAk
  id: EFSBaseWeaponAk74
  abstract: true
  description: "Автомат Калашникова калибра 5,45 мм, разработанный в 1970 году конструктором М. Т. Калашниковым как дальнейшее развитие АКМ в связи с переходом Вооруженных Сил на новый боеприпас 5.45x39."
  components:
  - type: ItemSlots
    slots:
      gun_suppressor:
        whitelist:
          tags:
            - EFSAk74Barrel
      gun_receiver:
        whitelist:
          tags:
            - EFSAkReceiver
      gun_stock:
        whitelist:
          tags:
            - EFSAkStock
      gun_forearm:
        whitelist:
          tags:
            - EFSAkForearm
      gun_magazine:
        insertSound: /Audio/GG/Weapons/AK/in.ogg
        ejectSound: /Audio/GG/Weapons/AK/out.ogg
        whitelist:
          tags:
            - EFSMagazineRifle5.45x39
  - type: Gun
    minAngle: 3
    maxAngle: 16
    angleIncrease: 5
    angleDecay: 20
    fireRate: 6.77

