  - type: ScopeVisuals
    scopeState: scope
  - type: Scope
  - type: ContainerContainer
    containers:
      gun_scope: !type:ContainerSlot
  - type: ItemSlots
    slots:
      gun_chamber:
        name: Chamber
        startingItem: Cartridge5.45x39
        priority: 1
        whitelist:
          tags:
            - Cartridge5.45x39
      gun_magazine:
        priority: 0
        startingItem: EFSMagazineRifle6L23
        insertSound: /Audio/GG/Weapons/AK/in.ogg
        ejectSound: /Audio/GG/Weapons/AK/out.ogg
        whitelist:
          tags:
            - EFSMagazineRifle5.45x39
      gun_suppressor:
        startingItem: EFSAkAttachmentBarrel6p20
        whitelist:
          tags:
            - EFSAk74Barrel
      gun_receiver:
        startingItem: EFSAksuAttachmentReceiverStandart
        whitelist:
          tags:
            - EFSAksuReceiver
      gun_stock:
        startingItem: EFSAksuAttachmentStock
        whitelist:
          tags:
            - EFSAksuStock
      gun_forearm:
        startingItem: EFSAksuAttachmentForearm
        whitelist:
          tags:
            - EFSAksuForearm
      gun_scope:
        whitelist:
          tags:
            - EFSNScope

