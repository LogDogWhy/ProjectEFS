- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxPistol9x19
  name: ammunition box (.35 auto)
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge9x19
    proto: Cartridge9x19
    capacity: 50
  - type: Item
    size: Tiny
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: GG/Weapons/Ammo/ammobox.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
  - type: ESWeight
    self: 0.01

- type: entity
  parent: BaseMagazineBoxPistol9x19
  id: MagazineBoxPistol9x19
  name: Коробка патронов (9x19)
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge9x19
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
    - state: 9x19
  - type: ESWeight
    self: 0.01

